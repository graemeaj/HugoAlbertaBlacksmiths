{{- /* Full-screen photo viewer for {{< gallery >}} photos. */ -}}
<style>
  .lightbox { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0, 0, 0, 0.85); padding: 1rem; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 6rem); box-shadow: 0 0 24px rgba(0, 0, 0, 0.6); cursor: default; }
  .lightbox p { color: #fff; margin: 0.75rem 0 0; font-family: sans-serif; text-align: center; }
  .lightbox button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.5rem; line-height: 1; padding: 0.5rem 0.75rem; cursor: pointer; opacity: 0.8; }
  .lightbox button:hover { opacity: 1; }
  .lightbox .lb-close { top: 0.5rem; right: 0.5rem; }
  .lightbox .lb-prev { left: 0.5rem; top: 50%; transform: translateY(-50%); }
  .lightbox .lb-next { right: 0.5rem; top: 50%; transform: translateY(-50%); }
</style>
<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" aria-label="Close">&times;</button>
  <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
  <img alt="">
  <p></p>
  <button class="lb-next" aria-label="Next photo">&#8250;</button>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.querySelector('.lightbox');
    var img = box.querySelector('img');
    var cap = box.querySelector('p');
    var links = Array.prototype.slice.call(document.querySelectorAll('a.gallery-photo'));
    var current = 0;

    function show(i) {
      current = (i + links.length) % links.length;
      var link = links[current];
      img.src = link.getAttribute('href');
      img.alt = link.dataset.caption || '';
      cap.textContent = link.dataset.caption || '';
      box.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      box.classList.remove('open');
      document.body.style.overflow = '';
    }

    links.forEach(function (link, i) {
      link.addEventListener('click', function (e) { e.preventDefault(); show(i); });
    });
    box.addEventListener('click', function (e) { if (e.target === box || e.target === cap) close(); });
    box.querySelector('.lb-close').addEventListener('click', close);
    box.querySelector('.lb-prev').addEventListener('click', function () { show(current - 1); });
    box.querySelector('.lb-next').addEventListener('click', function () { show(current + 1); });
    document.addEventListener('keydown', function (e) {
      if (!box.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });
  });
</script>
