  <g font-size="46" font-weight="700" fill="#2b2b2b" text-anchor="middle">
    <text x="252" y="395">Safety glasses</text>
    <text x="756" y="395">Cotton clothing</text>
    <text x="1260" y="395">Steel-toe boots</text>
    <text x="1764" y="395">Hammer</text>
    <text x="252" y="880">Notebook &amp; pencil</text>
    <text x="756" y="880">Water</text>
    <text x="1260" y="880">Lunch</text>
    <text x="1764" y="880">Good attitude</text>
  </g>
</svg>
